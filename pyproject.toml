[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-scorer"
version = "1.0.0"
description = "Explainable, cohort-relative creator quality scoring with heuristic authenticity signals and CPM/CPE"
authors = [
  { name = "SriRamKunamsetty", email = "mohansriramkunamsetty@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.3.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0"
]
api = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.22.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0"
]
postgres = [
  "psycopg[binary]>=3.1"
]
test = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  "httpx>=0.24.0"
]
all = [
  "scikit-learn>=1.3.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.22.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "psycopg[binary]>=3.1",
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "httpx>=0.24.0"
]

[project.scripts]
creatorscore = "creatorscore.cli:main"

[tool.setuptools.package-data]
creatorscore = ["schema.sql"]
