version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creatorscore-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://creator:scorer_secret@postgres:5432/creatorscore
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - creatorscore-net

  postgres:
    image: postgres:16-alpine
    container_name: creatorscore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: creatorscore
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: scorer_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creatorscore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creatorscore-net

  redis:
    image: redis:7-alpine
    container_name: creatorscore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - creatorscore-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: creatorscore-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - api
    networks:
      - creatorscore-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: creatorscore-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - creatorscore-net

networks:
  creatorscore-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  grafana-data:
